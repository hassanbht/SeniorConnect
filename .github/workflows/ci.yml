name: SeniorConnect CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: .NET 10 Backend & Architecture Tests
    runs-on: ubuntu-latest

    # Phase 5A gate: PostgreSQL integration tests must RUN here, not skip.
    # Each test class gets its own empty, freshly migrated database
    # (tests/backend/SeniorConnect.Modules.HelpRequests.Tests/PostgresTestDatabase.cs);
    # this server only provides the admin connection. 5432 is free on
    # ubuntu-latest runners, and CI needs no data volume.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seniorconnect
          POSTGRES_PASSWORD: seniorconnect_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seniorconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Solution
        run: dotnet restore backend/SeniorConnect.slnx

      - name: Build Backend Solution
        run: dotnet build backend/SeniorConnect.slnx --no-restore -c Release

      - name: Run Architecture & Domain Tests
        env:
          # Empty-database-per-class Postgres integration tests (Phase 4 gate).
          SC_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=seniorconnect;Password=seniorconnect_ci_password
        run: dotnet test backend/SeniorConnect.slnx --no-build -c Release --verbosity normal

      - name: Security & Dependency Vulnerability Scan (P7-11)
        # Fails the job when any vulnerable package (direct or transitive) is found.
        run: |
          dotnet list backend/SeniorConnect.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q '^\s*>' vulnerable.txt; then echo "Vulnerable packages found"; exit 1; fi

  mobile-checks:
    name: Flutter Multi-Matrix & Localization Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Translation Locales (de/en/fa)
        run: python mobile/senior_connect/scripts/check_locales.py mobile/senior_connect/assets/translations

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile/senior_connect
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile/senior_connect
        run: flutter analyze

      - name: Run Matrix Widget & Accessibility Tests
        working-directory: mobile/senior_connect
        run: flutter test

  container-checks:
    name: Docker Containerization Build (P9-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: seniorconnect-api:ci-test
